<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="508px" preserveAspectRatio="none" style="width:697px;height:508px;background:#FFFFFF;" version="1.1" viewBox="0 0 697 508" width="697px" zoomAndPan="magnify"><title>Estados da solicita&#231;&#227;o (aprova&#231;&#227;o e identidade)</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="319.7646" x="181.8184" y="24.5332">Estados da solicita&#231;&#227;o (aprova&#231;&#227;o e identidade)</text></g><ellipse cx="254" cy="54.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="pendente"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="78.3926" x="215" y="171.1094"/><line style="stroke:#181818;stroke-width:0.5;" x1="215" x2="293.3926" y1="198.7188" y2="198.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.3926" x="225" y="190.6426">pendente</text></g><g id="aprovada"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="78.3789" x="7" y="340.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="85.3789" y1="368.2188" y2="368.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.3789" x="17" y="360.1426">aprovada</text></g><g id="negada"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="66.7168" x="138.5" y="340.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="138.5" x2="205.2168" y1="368.2188" y2="368.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="46.7168" x="148.5" y="360.1426">negada</text></g><g id="expirada"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.7031" x="241" y="340.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="241" x2="314.7031" y1="368.2188" y2="368.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.7031" x="251" y="360.1426">expirada</text></g><ellipse cx="172" cy="491.6094" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="172" cy="491.6094" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="19" data-uid="ent0003" id="entity_GMN2"><path d="M374.5,158.6094 L374.5,234.0156 L571.1206,234.0156 L571.1206,168.6094 L561.1206,158.6094 L374.5,158.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M561.1206,158.6094 L561.1206,168.6094 L571.1206,168.6094 L561.1206,158.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.0425" x="380.5" y="177.1045">chk_nao_autoaprova:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.6206" x="380.5" y="193.4561">decidido_por &lt;&gt; solicitante_id.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.9707" x="380.5" y="209.8076">Auto-aprova&#231;&#227;o transformaria</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.8208" x="380.5" y="226.1592">a fila num carimbo.</text></g><g class="entity" data-entity="GMN5" data-source-line="26" data-uid="ent0006" id="entity_GMN5"><path d="M350,311.6094 L350,419.7188 L690.4014,419.7188 L690.4014,321.6094 L680.4014,311.6094 L350,311.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M680.4014,311.6094 L680.4014,321.6094 L690.4014,321.6094 L680.4014,311.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.4141" x="356" y="330.1045">chk_decisao_coerente impede a linha meio-decidida:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.3706" x="363.2236" y="346.4561">pendente -&gt; sem decisor e sem data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.0898" x="363.2236" y="362.8076">expirada -&gt; sem decisor</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.9868" x="363.2236" y="379.1592">aprovada/negada -&gt; decisor E data obrigat&#243;rios</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.4014" x="356" y="395.5107">O aprovador executa os `argumentos` gravados, nunca</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.3232" x="356" y="411.8623">uma reconstru&#231;&#227;o a partir do texto do pedido.</text></g><!--link *start* to pendente--><g class="link" data-entity-1=".start." data-entity-2="pendente" data-source-line="8" data-uid="lnk4" id="link_.start._pendente"><path d="M254,64.7594 C254,86.0394 254,133.3994 254,164.8594" fill="none" id="*start*-to-pendente" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="254,170.8594,258,161.8594,254,165.8594,250,161.8594,254,170.8594" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.458" x="280.9873" y="109.1045">pedido registrado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.4326" x="255" y="125.4561">com argumentos (JSONB)</text></g><!--link pendente to aprovada--><g class="link" data-entity-1="pendente" data-entity-2="aprovada" data-source-line="10" data-uid="lnk6" id="link_pendente_aprovada"><path d="M214.81,196.3494 C164.66,197.7694 79.46,208.7394 39,263.6094 C22.73,285.6794 27.015,312.6599 34.305,334.8199" fill="none" id="pendente-to-aprovada" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="36.18,340.5194,37.1672,330.7201,34.6175,335.7698,29.5679,333.2201,36.18,340.5194" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.5234" x="40" y="278.1045">outra pessoa aprova</text></g><!--link pendente to negada--><g class="link" data-entity-1="pendente" data-entity-2="negada" data-source-line="11" data-uid="lnk8" id="link_pendente_negada"><path d="M214.73,218.8194 C198.7,229.9394 181.88,245.0694 173,263.6094 C161.41,287.8094 162.3719,313.2347 165.7819,334.5447" fill="none" id="pendente-to-negada" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="166.73,340.4694,169.2577,330.9504,165.94,335.5322,161.3582,332.2145,166.73,340.4694" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.6943" x="174" y="278.1045">outra pessoa nega</text></g><!--link pendente to expirada--><g class="link" data-entity-1="pendente" data-entity-2="expirada" data-source-line="12" data-uid="lnk10" id="link_pendente_expirada"><path d="M270.79,221.1594 C278.25,233.2894 286.2,248.5894 290,263.6094 C296.5,289.2894 292.803,313.7485 287.343,334.4085" fill="none" id="pendente-to-expirada" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="285.81,340.2094,291.9768,332.5301,287.0875,335.3753,284.2423,330.4861,285.81,340.2094" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.2598" x="293" y="278.1045">passou de expira_em (48h)</text></g><!--link aprovada to *end*--><g class="link" data-entity-1="aprovada" data-entity-2=".end." data-source-line="14" data-u