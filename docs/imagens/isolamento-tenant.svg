belas</text></g><!--entity guc--><g class="entity" data-entity="guc" data-source-line="18" data-uid="ent0009" id="entity_guc"><rect fill="#F1F1F1" height="65.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="219.7852" x="98.5" y="345.6094"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="298.2852" y="350.6094"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="296.2852" y="352.6094"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="296.2852" y="356.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.1543" x="113.5" y="380.1426">SET app.clinica_id = &lt;id&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179.7852" x="113.5" y="397.752">feito no dal.ts a cada request</text></g><!--entity tabelas--><g class="entity" data-entity="tabelas" data-source-line="21" data-uid="ent0010" id="entity_tabelas"><path d="M173.5,582.1094 C173.5,572.1094 208.4033,572.1094 208.4033,572.1094 C208.4033,572.1094 243.3066,572.1094 243.3066,582.1094 L243.3066,608.7188 C243.3066,618.7188 208.4033,618.7188 208.4033,618.7188 C208.4033,618.7188 173.5,618.7188 173.5,608.7188 L173.5,582.1094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M173.5,582.1094 C173.5,592.1094 208.4033,592.1094 208.4033,592.1094 C208.4033,592.1094 243.3066,592.1094 243.3066,582.1094" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="49.8066" x="183.5" y="610.6426">Tabelas</text></g><g class="entity" data-entity="GMN15" data-source-line="30" data-uid="ent0016" id="entity_GMN15"><path d="M279,484.1094 L279,592.1094 L243.72,596.1094 L279,600.1094 L279,706.6797 A0,0 0 0 0 279,706.6797 L752.4482,706.6797 A0,0 0 0 0 752.4482,706.6797 L752.4482,494.1094 L742.4482,484.1094 L279,484.1094 A0,0 0 0 0 279,484.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M742.4482,484.1094 L742.4482,494.1094 L752.4482,494.1094 L742.4482,484.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.2998" x="285" y="502.6045">Toda tabela COM clinica_id:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.1099" x="292.2236" y="518.9561">ENABLE ROW LEVEL SECURITY</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.3081" x="292.2236" y="535.3076">FORCE ROW LEVEL SECURITY</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.3862" x="292.2236" y="551.6592">POLICY rls_tenant</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.001" x="299.4473" y="568.0107">USING       (clinica_id = NULLIF(current_setting('app.clinica_id', true), '')::int)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.3882" x="299.4473" y="584.3623">WITH CHECK  (idem)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="285" y="600.7139">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.0024" x="285" y="617.0654">FAIL-CLOSED: sem o GUC, current_setting devolve</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.0605" x="285" y="633.417">vazio -&gt; NULLIF -&gt; NULL -&gt; a compara&#231;&#227;o nunca &#233;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.8306" x="285" y="649.7686">verdadeira -&gt; ZERO linhas. Esquecer de setar o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.5469" x="285" y="666.1201">tenant n&#227;o abre o banco, fecha ele.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="285" y="682.4717">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.5068" x="285" y="698.8232">FORCE: nem o dono da tabela escapa da pol&#237;tica.</text></g><g class="entity" data-entity="GMN18" data-source-line="46" data-uid="ent0019" id="entity_GMN18"><path d="M6,767.1094 L6,891.5703 A0,0 0 0 0 6,891.5703 L410.7158,891.5703 A0,0 0 0 0 410.7158,891.5703 L410.7158,777.1094 L400.7158,767.1094 L212.5,767.1094 L208.5,619.2794 L204.5,767.1094 L6,767.1094 A0,0 0 0 0 6,767.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M400.7158,767.1094 L400.7158,777.1094 L410.7158,777.1094 L400.7158,767.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.8906" x="12" y="785.6045">Ficam DE FORA por n&#227;o serem dado de cl&#237;nica:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.144" x="19.2236" y="801.9561">papel, acao, papel_acao      &#8212; cat&#225;logo RBAC global</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.1714" x="19.2236" y="818.3076">estado_* , transicao_*       &#8212; m&#225;quinas de estado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.3296" x="19.2236" y="834.6592">funcao_alcance               &#8212; governan&#231;a de jobs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.9517" x="19.2236" y="851.0107">login_tentativas,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.4922" x="19.2236" y="867.3623">identidade_tentativas        &#8212; rate-limit (revogadas de app_painel)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.8677" x="12" y="883.7139">Exclus&#227;o &#233; decis&#227;o registrada, n&#227;o tabela esquecida.</text></g><g class="entity" data-entity="GMN21" data-source-line="56" data-uid="ent0022" id="entity_GMN21"><path d="M354,332.1094 L354,423.8672 A0,0 0 0 0 354,423.8672 L698.7114,423.8672 A0,0 0 0 0 698.7114,423.8672 L698.7114,342.1094 L688.7114,332.1094 L473.5,332.1094 L469.5,269.8094 L465.5,332.1094 L354,332.1094 A0,0 0 0 0 354,332.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M688.7114,332.1094 L688.7114,342.1094 L698.7114,342.1094 L688.7114,332.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9033" x="360" y="350.6045">Contradi&#231;&#227;o aberta em MAPA-OPERACAO.md &#167;2.4:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.7114" x="360" y="366.9561">os workflows escrevem em agendamentos_sofia_demo,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.6123" x="360" y="383.3076">mas essa tabela n&#227;o aparece na lista de GRANT do</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.0869" x="360" y="399.6592">001-lockdown.sql. sofia-demo/sql/_diag1.sql</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.897" x="360" y="416.0107">responde isso contra o banco vivo.</text></g><!--link painel to app_painel--><g class="link" data-entity-1="painel" data-entity-2="app_painel" data-source-line="24" data-uid="lnk11" id="link_painel_app_painel"><path d="M281.5,128.9094 C281.5,150.1294 28