<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon do painel. Convenção `app/icon.svg` do Next: o framework injeta o
    <link rel="icon"> sozinho. Antes disso, /favicon.ico respondia 404 em toda
    visita e a aba mostrava o ícone genérico.

    É o mesmo pulso (ECG) que o Wordmark usa em src/components/ui.tsx, com o
    traçado idêntico ao Icon.Pulse de icons.tsx — favicon é a marca em 16px,
    não um desenho novo. Cores: brand-600 de fundo, o verde do painel.
  -->
  <rect width="32" height="32" rx="8" fill="#15a33a" />
  <g transform="translate(4 4)" stroke="#ffffff" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
  </g>
</svg>
